# Local dev config. Don't mount this into the Docker image — its paths are
# relative to the repo and it only listens on loopback. Use docker/config.toml.

listen = "127.0.0.1:4000"
db_path = "attic.db"

# Reject a single upload once its streamed body exceeds this many bytes.
# Defaults to 50 GiB when omitted.
max_upload_bytes = 53687091200

# Each immediate subdirectory here is exposed as a drive, named after the folder.
# Created on startup if missing.
roots_dir = "./roots"

# On-demand generated thumbnail cache. Created on startup if missing.
thumbs_dir = "./thumbs"

# Max thumbnails decoded/resized/encoded at once. Each one is CPU- and
# memory-heavy in proportion to the source image's megapixels, not its file
# size, so raise this only as high as the box (or container quota) can
# actually run concurrently. Defaults to 2 when omitted.
thumbnail_concurrency = 2

[auth]
owner_username = "homelab"
# The owner password hash is a secret and lives in the (gitignored) .env file as
# VAULT_OWNER_PASSWORD_HASH — not here, since this file is committed. Generate one
# with `cargo run -- hash-password`. See .env.example.

# Keep true in production (HTTPS). false only for local plain-http dev.
secure_cookies = false
session_ttl_days = 7
