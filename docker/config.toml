listen = "0.0.0.0:4000"
db_path = "/data/attic.db"

max_upload_bytes = 53687091200

# Every subdirectory mounted under here becomes a drive in the UI, named after
# the folder. Add drives by mounting them in docker-compose.yml — no edits here.
roots_dir = "/data/roots"

# On-demand generated thumbnail cache, kept under the same /data volume.
thumbs_dir = "/data/thumbs"

# Max thumbnails decoded/resized/encoded at once. Raise only as high as the
# container's actual CPU/memory limits allow — see docs/config.toml comment.
thumbnail_concurrency = 2

# Max video thumbnails (ffmpeg frame extraction) running at once — kept low
# since each is a whole ffmpeg process, not just a resize.
video_thumbnail_concurrency = 1

[auth]
owner_username = "admin"
secure_cookies = false
session_ttl_days = 7
